# /etc/nginx/sites-available/grantha  (symlink into sites-enabled)
# Certbot adds the HTTPS server block + redirect for you (step 9 of DEPLOYMENT.md).
server {
    listen 80;
    listen [::]:80;
    server_name askgrantha.com www.askgrantha.com;

    root /opt/grantha/frontend/dist;
    index index.html;

    client_max_body_size 25m;   # /api/ingest PDF uploads

    # API -> gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Built assets are content-hashed: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
